name: Chibi merge policy

on:
  push:
    branches: [main]
  issues:
    types: [labeled, unlabeled]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  policy:
    uses: ./.github/workflows/chibi-merge-policy-reusable.yml
    with:
      gate_ready: ${{ vars.CHIBI_REVIEW_GATE_READY == 'true' }}
      enroll_after: ${{ vars.CHIBI_REVIEW_POLICY_START_AT }}
      post_merge_workflows: >-
        [{"workflow":"ci.yml","ignore":["README.md","AGENTS.md","docs/**",".claude/**","web/**","EXTRACTION.json",".github/workflows/publish.yml"]},{"workflow":"publish.yml","include":["src/**","include/**","projects/**","web/**","cmake/**","CMakeLists.txt",".github/workflows/publish.yml"]}]
    permissions:
      contents: write
      actions: write
      checks: write
      issues: write
      pull-requests: write

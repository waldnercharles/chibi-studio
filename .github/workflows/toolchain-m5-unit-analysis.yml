name: Integrated compiler transport and semantic validation (review-gated draft)

# Replace the existing PR81 workflow only after coordinator release and exact review.
# Retain the branch; do not merge this temporary test-only control or deploy from it.
# Raw logs and private source stay on the ephemeral runner.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: host-m5-compiler-transport-${{ github.event.pull_request.number }}
  # Preserve every admitted baseline/candidate run; do not silently cancel it.
  cancel-in-progress: false

jobs:
  compiler-transport:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/host-m5-unit-validation-20261018' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: e165059d1c17ec7605d909ae3bbf727d9e267a80
      CANDIDATE_TREE: 8e5ea89dfe428ca7804b68af0c85ba35e5e74b5e
      TRANSPORT_REVIEWED: 'true'
      SEMANTIC_COMPONENTS_REVIEWED: 'true'
      EXPECTED_BASE_SHA: bee5b54e159cce44ee52ca9439be587d9a95f5d2
      SOURCE_BRANCH: refs/heads/codex/m5-compiler-transport-20261018
      CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Require safe normal checkout logging and a fresh source path
        env:
          RUNNER_DEBUG_ENABLED: ${{ runner.debug }}
        run: |
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != 1 || "$TRANSPORT_REVIEWED" != true || "$SEMANTIC_COMPONENTS_REVIEWED" != true || ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'phase=source-admission exit=1\n'
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != waldnercharles/chibi-studio ||
                "$PR_BASE_SHA" != "$EXPECTED_BASE_SHA" || ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ||
                "$PR_BASE_BRANCH" != main || "$PR_HEAD_BRANCH" != codex/host-m5-unit-validation-20261018 ||
                "$SOURCE_BRANCH" != refs/heads/codex/m5-compiler-transport-20261018 ||
                ! "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'phase=source-admission exit=1\n'
            exit 1
          fi
          case "$RUNNER_DEBUG_ENABLED" in
            ''|0) ;;
            *) printf 'phase=checkout-privacy-guard exit=1\n'; exit 1 ;;
          esac
          if [ -e "$GITHUB_WORKSPACE/validation" ] || [ -e "$GITHUB_WORKSPACE/chibi" ] || ! git --version >/dev/null 2>&1; then
            printf 'phase=checkout-privacy-guard exit=1\n'
            exit 1
          fi
          printf 'phase=checkout-privacy-guard exit=0\n'

      - name: Check out the immutable reviewed control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONTROL_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: validation

      - name: Read the one engine branch, then require the immutable admitted identity
        # Branch checkout avoids Git's detached-HEAD commit-subject message.
        # The trusted source-identity gate rejects moved branches before helper execution.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: waldnercharles/chibi
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1
          persist-credentials: false
          path: chibi
          show-progress: false
          fetch-tags: false
          clean: false
          submodules: false
          lfs: false

      - name: Reject any unreviewed source before invoking its private helper
        id: source_identity
        run: |
          set +x
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]] ||
             ! source_head=$(git -C "$GITHUB_WORKSPACE/chibi" rev-parse HEAD 2>/dev/null) ||
             ! source_tree=$(git -C "$GITHUB_WORKSPACE/chibi" rev-parse 'HEAD^{tree}' 2>/dev/null) ||
             ! source_status=$(git -C "$GITHUB_WORKSPACE/chibi" status --porcelain 2>/dev/null) ||
             [[ "$source_head" != "$CANDIDATE_SHA" || "$source_tree" != "$CANDIDATE_TREE" || -n "$source_status" ]]; then
            printf 'phase=source-identity-guard exit=1\n'
            exit 1
          fi
          printf 'phase=source-identity-guard exit=0\n'

      - name: Verify reviewed source and control identities
        run: bash chibi/.github/scripts/transport-validation.sh prepare
      - name: Acquire pinned compiler build inputs privately
        run: bash chibi/.github/scripts/transport-validation.sh dependencies
      - name: Configure ordinary compiler-only language and tooling builds
        run: bash chibi/.github/scripts/transport-validation.sh configure
      - name: Build the real language, tooling and compiler-host targets separately from execution
        run: bash chibi/.github/scripts/transport-validation.sh build

      - name: Audit the normal unstripped product and positive producer writer boundary
        run: bash chibi/.github/scripts/transport-validation.sh audit

      - name: Full source snapshot selector under its production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-package-snapshot-chibi
        run: bash chibi/.github/scripts/transport-validation.sh execute
      - name: Full compiler artifact selector under its separate production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: compiler-artifact
        run: bash chibi/.github/scripts/transport-validation.sh execute

      - name: Full union members regression under its separate production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-union-members-chibi
        run: bash chibi/.github/scripts/transport-validation.sh execute
      - name: Full effect analysis regression under its separate production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-effect-analysis-chibi
        run: bash chibi/.github/scripts/transport-validation.sh execute
      - name: Full record members regression under its separate production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-record-members-chibi
        run: bash chibi/.github/scripts/transport-validation.sh execute
      - name: Full unit analysis regression under its separate production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-unit-analysis-chibi
        run: bash chibi/.github/scripts/transport-validation.sh execute
      - name: Full type relations regression under its separate production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-type-relations-chibi
        run: bash chibi/.github/scripts/transport-validation.sh execute

      - name: Project raw runner-local logs into minimal statuses
        if: always() && steps.source_identity.outcome == 'success'
        run: bash chibi/.github/scripts/transport-validation.sh collect
      - name: Upload status timing and SHA identities only
        if: always() && steps.source_identity.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-transport-status-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chibi-m5-transport-status/status.json
          if-no-files-found: error
          retention-days: 7
      - name: Require the boundary audit and all seven complete selectors to pass
        if: always() && steps.source_identity.outcome == 'success'
        run: bash chibi/.github/scripts/transport-validation.sh verdict

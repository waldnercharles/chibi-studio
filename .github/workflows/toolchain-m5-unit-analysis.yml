name: Native unit adapter validation (review-gated draft)

# Temporary test-only control. Source, configuration and the complete five-selector
# workload require independent admission for these exact immutable pins.
# Retain this branch; do not merge this workflow or deploy from it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: host-m5-native-unit-${{ github.event.pull_request.number }}
  # Preserve every admitted baseline/candidate run; do not silently cancel it.
  cancel-in-progress: false

jobs:
  native-unit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/host-m5-unit-validation-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 06a5ae206b4daf2a5f58d66969faa008bf9c57f3
      CANDIDATE_TREE: da159481fb0d25c9deacd9e87525ac4a82846dff
      NATIVE_UNIT_REVIEWED: 'true'
      CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Require safe normal checkout logging and a fresh source path
        env:
          RUNNER_DEBUG_ENABLED: ${{ runner.debug }}
        run: |
          if [[ "$NATIVE_UNIT_REVIEWED" != true || ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'phase=source-admission exit=1\n'
            exit 1
          fi
          case "$RUNNER_DEBUG_ENABLED" in
            ''|0) ;;
            *) printf 'phase=checkout-privacy-guard exit=1\n'; exit 1 ;;
          esac
          if [ -e "$GITHUB_WORKSPACE/validation" ] || [ -e "$GITHUB_WORKSPACE/chibi" ] || ! git --version >/dev/null 2>&1; then
            printf 'phase=checkout-privacy-guard exit=1\n'
            exit 1
          fi
          printf 'phase=checkout-privacy-guard exit=0\n'

      - name: Check out the immutable reviewed control candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONTROL_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: validation

      - name: Read the one engine branch, then require the immutable admitted identity
        # Branch checkout avoids Git's detached-HEAD commit-subject message.
        # The trusted source-identity gate rejects moved branches before helper execution.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: waldnercharles/chibi
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ref: refs/heads/codex/m5-unit-native-adapter-20261018
          fetch-depth: 1
          persist-credentials: false
          path: chibi
          show-progress: false
          fetch-tags: false
          clean: false
          submodules: false
          lfs: false

      - name: Reject any unreviewed source before invoking its private helper
        id: source_identity
        run: |
          set +x
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]] ||
             ! source_head=$(git -C "$GITHUB_WORKSPACE/chibi" rev-parse HEAD 2>/dev/null) ||
             ! source_tree=$(git -C "$GITHUB_WORKSPACE/chibi" rev-parse 'HEAD^{tree}' 2>/dev/null) ||
             ! source_status=$(git -C "$GITHUB_WORKSPACE/chibi" status --porcelain 2>/dev/null) ||
             [[ "$source_head" != "$CANDIDATE_SHA" || "$source_tree" != "$CANDIDATE_TREE" || -n "$source_status" ]]; then
            printf 'phase=source-identity-guard exit=1\n'
            exit 1
          fi
          printf 'phase=source-identity-guard exit=0\n'

      - name: Verify reviewed source and control identities
        run: bash chibi/.github/scripts/native-unit-validation.sh prepare
      - name: Acquire pinned native and compiler build inputs privately
        run: bash chibi/.github/scripts/native-unit-validation.sh dependencies
      - name: Configure the native reflection generator
        run: bash chibi/.github/scripts/native-unit-validation.sh configure_reflect
      - name: Build reflect only
        run: bash chibi/.github/scripts/native-unit-validation.sh build_reflect
      - name: Configure actual compiler native desktop tools closure
        run: bash chibi/.github/scripts/native-unit-validation.sh configure_tools
      - name: Build actual test_tools and declared dependencies
        run: bash chibi/.github/scripts/native-unit-validation.sh build_tools
      - name: Configure standalone language dispatcher
        run: bash chibi/.github/scripts/native-unit-validation.sh configure_language
      - name: Build test_language separately from execution
        run: bash chibi/.github/scripts/native-unit-validation.sh build_language

      - name: Existing semantic selector under its own production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-semantic
        run: bash chibi/.github/scripts/native-unit-validation.sh execute
      - name: Existing incremental selector under its own production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-incremental
        run: bash chibi/.github/scripts/native-unit-validation.sh execute
      - name: Existing real unit-fixtures selector under its own production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: unit-fixtures
        run: bash chibi/.github/scripts/native-unit-validation.sh execute

      - name: Existing full unit differential under its own production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: language-unit-analysis-chibi
        run: bash chibi/.github/scripts/native-unit-validation.sh execute

      - name: Complete desktop-dependencies selector under its own production 60-second ceiling
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELECTOR: desktop-dependencies
        run: bash chibi/.github/scripts/native-unit-validation.sh execute

      - name: Project raw runner-local logs into minimal statuses
        if: always() && steps.source_identity.outcome == 'success'
        run: bash chibi/.github/scripts/native-unit-validation.sh collect
      - name: Upload status timing and SHA identities only
        if: always() && steps.source_identity.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-unit-status-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chibi-native-unit-status/status.json
          if-no-files-found: error
          retention-days: 7
      - name: Require all five exact complete selectors to pass
        if: always() && steps.source_identity.outcome == 'success'
        run: bash chibi/.github/scripts/native-unit-validation.sh verdict

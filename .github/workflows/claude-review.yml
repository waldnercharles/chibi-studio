name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Needs two secrets: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) and
# CHIBI_BOT_TOKEN, a PAT with contents/pull-requests write. A PAT, not
# GITHUB_TOKEN, so fix pushes re-run CI and merges trigger push workflows.
# Add the `hold` label to a PR to keep it out of review and merge.

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review, fix and merge
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.CHIBI_BOT_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.CHIBI_BOT_TOKEN }}
      - uses: anthropics/claude-code-action@3526ba0182e074276813d3014cc27ac6720b8648 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CHIBI_BOT_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(make:*),Bash(gh pr:*)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} by following
            .claude/skills/pr-review/SKILL.md, plus AGENTS.md conventions and missing
            pico_unit coverage. Then fix every real problem you find instead of only
            reporting it: edit the files, build and run the admitted checks that cover
            them (60-second ceiling, see AGENTS.md), commit with an imperative message
            and `git push` to the PR branch. Do not merge, close or relabel the PR.
            Ignore nits. If a problem needs an owner decision you cannot make, add the
            `hold` label with `gh pr edit ${{ github.event.pull_request.number }} --add-label hold`
            and explain in one PR comment. Finish with a short PR comment summarizing
            findings and fixes, in the tone the skill specifies.
      - name: Merge once checks pass
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name]|join(",")')
          case ",$labels," in *,hold,*) echo "held"; exit 0;; esac
          sleep 60  # let checks register for the head Claude may have pushed
          while :; do
            states=$(gh pr checks "$PR" --json name,bucket \
              --jq '[.[] | select(.name != "Review, fix and merge") | .bucket] | unique | join(" ")')
            case " $states " in
              *" fail "*|*" cancel "*) gh pr checks "$PR" || true; echo "::error::Checks failed; not merging."; exit 1;;
              *" pending "*) sleep 30;;
              *) break;;
            esac
          done
          gh pr merge "$PR" --squash --delete-branch

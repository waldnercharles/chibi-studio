name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/**"
      - "web/**"
      - "EXTRACTION.json"
      - ".github/workflows/publish.yml"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/**"
      - "web/**"
      - "EXTRACTION.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang-18
  CXX: clang++-18
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy

jobs:
  studio:
    # Isolate the temporary, explicitly do-not-merge M5 validation control PR.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'codex/host-m5-unit-validation-20261018'
    name: Build and startup against engine main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: chibi-studio
      - name: Require engine checkout access
        env:
          TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a CHIBI_ENGINE_TOKEN secret that can read waldnercharles/chibi."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          path: chibi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-18-dev ninja-build xvfb \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Identify SDK and dependency sources
        id: deps
        working-directory: chibi
        run: |
          {
            echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)"
            echo "engine=$(git rev-parse HEAD)"
            echo "toolchain=$({ clang-18 --version; cmake --version; } | sha256sum | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"
      # A packaged SDK contains the complete engine products. Never restore an
      # SDK from a different engine revision or compiler configuration.
      - name: Restore packaged engine SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: chibi/dist/sdk
          key: studio-sdk-v1-ubuntu24-${{ runner.arch }}-debug-nosan-${{ steps.deps.outputs.toolchain }}-${{ steps.deps.outputs.engine }}
      - name: Download the published engine SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        id: published-sdk
        env:
          GH_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ENGINE: ${{ steps.deps.outputs.engine }}
        shell: bash
        run: |
          # Listing releases distinguishes an absent package from API/auth errors.
          gh api 'repos/waldnercharles/chibi/releases?per_page=100' > "$RUNNER_TEMP/engine-releases.json"
          available=$(python3 - "$RUNNER_TEMP/engine-releases.json" <<'PYCODE'
          import json, os, sys
          required = {"chibi-sdk-linux-x64.tar.gz", "SHA256SUMS"}
          release = next((r for r in json.load(open(sys.argv[1]))
                          if r["tag_name"] == "engine-" + os.environ["ENGINE"] and not r["draft"]), None)
          assets = {a["name"] for a in release["assets"] if a["state"] == "uploaded"} if release else set()
          print(str(required <= assets).lower())
          PYCODE
          )
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ]; then
            echo "No published SDK for engine $ENGINE; building from source."
            exit 0
          fi
          packages="$RUNNER_TEMP/engine-packages"
          mkdir -p "$packages" chibi/dist/sdk
          gh release download "engine-$ENGINE" --repo waldnercharles/chibi \
            --pattern chibi-sdk-linux-x64.tar.gz --pattern SHA256SUMS --dir "$packages"
          cd "$packages"
          awk '$2 == "chibi-sdk-linux-x64.tar.gz"' SHA256SUMS > selected-sums
          test "$(wc -l < selected-sums)" -eq 1
          sha256sum --check selected-sums
          tar -xzf chibi-sdk-linux-x64.tar.gz -C "$GITHUB_WORKSPACE/chibi/dist/sdk"
      - name: Restore dependencies
        if: steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true'
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: studio-deps-${{ runner.os }}-clang18-${{ steps.deps.outputs.key }}
          restore-keys: studio-deps-${{ runner.os }}-clang18-
      - name: Package the engine SDK
        if: steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true'
        working-directory: chibi
        run: make package-sdk SDK_PREFIX=dist/sdk LIBCLANG_ROOT=/usr/lib/llvm-18
      # PRs consume main's caches without uploading another branch-scoped copy.
      - name: Save packaged engine SDK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true'
        uses: actions/cache/save@v4
        with:
          path: chibi/dist/sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - name: Save dependencies
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true' && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}
      - name: Build Studio against the packaged SDK
        working-directory: chibi
        run: make studio-build STUDIO_SOURCE="$GITHUB_WORKSPACE/chibi-studio" STUDIO_SDK_PREFIX=dist/sdk
      - name: Two hidden Studio frames
        working-directory: chibi
        shell: bash
        run: |
          timeout 60 xvfb-run -a build-studio/bin/chibi-dev \
            --project-root ../chibi-studio/projects/starter --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee studio.log
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' studio.log
      - name: Two hidden frames of Studio's own project
        working-directory: chibi
        shell: bash
        run: |
          timeout 60 xvfb-run -a build-studio/bin/chibi-dev \
            --project-root build-studio/share/chibi/studio --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee own.log
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize|Could not load graph asset' own.log
      - name: Installed Studio opens the project it starts in
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/chibi"
          # SDK packages are relocatable; reuse the verified package without rebuilding.
          mkdir -p "$prefix"
          cp -a chibi/dist/sdk/. "$prefix/"
          make -C chibi-studio install PREFIX="$prefix"
          export PATH="$prefix/bin:$PATH"
          cd chibi-studio/projects/starter
          timeout 60 xvfb-run -a chibi-dev --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee "$RUNNER_TEMP/installed.log"
          chibi export . --output "$RUNNER_TEMP/export"
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' "$RUNNER_TEMP/installed.log"

name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/**"
      - "web/**"
      - "EXTRACTION.json"
      - ".github/workflows/publish.yml"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/**"
      - "web/**"
      - "EXTRACTION.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang-18
  CXX: clang++-18
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy

jobs:
  studio:
    name: Build and startup against selected engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: chibi-studio
          persist-credentials: false
      - name: Select the paired engine for a same-repository PR
        id: engine
        env:
          ALLOW_PIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          ref=main
          if [ "$ALLOW_PIN" = true ] && [ -f chibi-studio/.github/engine-ref ]; then
            ref=$(<chibi-studio/.github/engine-ref)
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::.github/engine-ref must contain one full lowercase engine commit SHA."
              exit 1
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Require engine checkout access
        env:
          TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a CHIBI_ENGINE_TOKEN secret that can read waldnercharles/chibi."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ref: ${{ steps.engine.outputs.ref }}
          persist-credentials: false
          path: chibi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-18-dev ninja-build xvfb \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Identify SDK and dependency sources
        id: deps
        working-directory: chibi
        env:
          ENGINE_REF: ${{ steps.engine.outputs.ref }}
        run: |
          if [ "$ENGINE_REF" != main ]; then
            test "$(git rev-parse HEAD)" = "$ENGINE_REF"
          fi
          {
            echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)"
            echo "engine=$(git rev-parse HEAD)"
            echo "toolchain=$({ clang-18 --version; cmake --version; } | sha256sum | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"
      # A packaged SDK contains the complete engine products. Never restore an
      # SDK from a different engine revision or compiler configuration.
      - name: Restore packaged engine SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: chibi/dist/sdk
          key: studio-sdk-v1-ubuntu24-${{ runner.arch }}-debug-nosan-${{ steps.deps.outputs.toolchain }}-${{ steps.deps.outputs.engine }}
      - name: Download the published engine SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        id: published-sdk
        env:
          GH_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ENGINE: ${{ steps.deps.outputs.engine }}
        shell: bash
        run: |
          # Listing releases distinguishes an absent package from API/auth errors.
          gh api 'repos/waldnercharles/chibi/releases?per_page=100' > "$RUNNER_TEMP/engine-releases.json"
          available=$(python3 - "$RUNNER_TEMP/engine-releases.json" <<'PYCODE'
          import json, os, sys
          required = {"chibi-sdk-linux-x64.tar.gz", "SHA256SUMS"}
          release = next((r for r in json.load(open(sys.argv[1]))
                          if r["tag_name"] == "engine-" + os.environ["ENGINE"] and not r["draft"]), None)
          assets = {a["name"] for a in release["assets"] if a["state"] == "uploaded"} if release else set()
          print(str(required <= assets).lower())
          PYCODE
          )
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ]; then
            echo "No published SDK for engine $ENGINE; building from source."
            exit 0
          fi
          packages="$RUNNER_TEMP/engine-packages"
          mkdir -p "$packages" chibi/dist/sdk
          gh release download "engine-$ENGINE" --repo waldnercharles/chibi \
            --pattern chibi-sdk-linux-x64.tar.gz --pattern SHA256SUMS --dir "$packages"
          cd "$packages"
          awk '$2 == "chibi-sdk-linux-x64.tar.gz"' SHA256SUMS > selected-sums
          test "$(wc -l < selected-sums)" -eq 1
          sha256sum --check selected-sums
          tar -xzf chibi-sdk-linux-x64.tar.gz -C "$GITHUB_WORKSPACE/chibi/dist/sdk"
      - name: Restore dependencies
        if: steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true'
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: studio-deps-${{ runner.os }}-clang18-${{ steps.deps.outputs.key }}
          restore-keys: studio-deps-${{ runner.os }}-clang18-
      - name: Package the engine SDK
        if: steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true'
        working-directory: chibi
        run: make package-sdk SDK_PREFIX=dist/sdk LIBCLANG_ROOT=/usr/lib/llvm-18
      # PRs consume main's caches without uploading another branch-scoped copy.
      - name: Save packaged engine SDK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true'
        uses: actions/cache/save@v4
        with:
          path: chibi/dist/sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - name: Save dependencies
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.sdk.outputs.cache-hit != 'true' && steps.published-sdk.outputs.available != 'true' && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}
      - name: Build Studio against the packaged SDK
        working-directory: chibi
        run: make studio-build STUDIO_SOURCE="$GITHUB_WORKSPACE/chibi-studio" STUDIO_SDK_PREFIX=dist/sdk
      - name: Two hidden Studio frames
        working-directory: chibi
        shell: bash
        run: |
          timeout 60 xvfb-run -a build-studio/bin/chibi-dev \
            --project-root ../chibi-studio/projects/starter --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee studio.log
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' studio.log
      - name: Two hidden frames of Studio's own project
        working-directory: chibi
        shell: bash
        run: |
          timeout 60 xvfb-run -a build-studio/bin/chibi-dev \
            --project-root build-studio/share/chibi/studio --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee own.log
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize|Could not load graph asset' own.log
      - name: Installed Studio opens the project it starts in
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/chibi"
          # SDK packages are relocatable; reuse the verified package without rebuilding.
          mkdir -p "$prefix"
          cp -a chibi/dist/sdk/. "$prefix/"
          make -C chibi-studio install PREFIX="$prefix"
          export PATH="$prefix/bin:$PATH"
          cd chibi-studio/projects/starter
          timeout 60 xvfb-run -a chibi-dev --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee "$RUNNER_TEMP/installed.log"
          chibi export . --output "$RUNNER_TEMP/export"
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' "$RUNNER_TEMP/installed.log"

  # Temporary validation for PR78 only; never merge this job into a product branch.
  catalog-regression:
    name: Empty-request catalog ASan and UBSan regression
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 78 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/validate-empty-source-requests-20261017' &&
      github.event.pull_request.base.sha == '5685b25c11a12b8c010bb2fdabf1cddf525883b9' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ENGINE: e06395e3c65838a2286a7f2bc82f0eb28bbd4b3c
      ENGINE_PARENT: 15b3845dbda3440a7fb831f51ef7d2a02e3c6f2d
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      UBSAN_SYMBOLIZER_PATH: /usr/lib/llvm-18/bin/llvm-symbolizer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi
          ref: e06395e3c65838a2286a7f2bc82f0eb28bbd4b3c
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: chibi
      - name: Verify source identities and isolate the negative control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C chibi rev-parse HEAD)" = "$ENGINE"
          test "$(git -C chibi rev-parse HEAD^)" = "$ENGINE_PARENT"
          test -z "$(git -C chibi status --porcelain)"
          test "$(git -C chibi rev-parse HEAD:src/authoring/source_catalog.c)" = e15d3d5ca64b2f92310351ab46f10d65d2513561
          test "$(git -C chibi rev-parse "$ENGINE_PARENT:src/authoring/source_catalog.c")" = d179b82e172dcc9ff4c0b8e96d66081f6202429a
          evidence="$RUNNER_TEMP/catalog-regression"
          mkdir "$evidence"
          git -C chibi worktree add --detach "$evidence/negative" "$ENGINE"
          git -C chibi show "$ENGINE_PARENT:src/authoring/source_catalog.c" > "$evidence/negative/src/authoring/source_catalog.c"
          test "$(git -C "$evidence/negative" diff --name-only)" = src/authoring/source_catalog.c
          test -z "$(git -C "$evidence/negative" ls-files --others --exclude-standard)"
          test "$(git -C "$evidence/negative" hash-object src/authoring/source_catalog.c)" = d179b82e172dcc9ff4c0b8e96d66081f6202429a
          git -C chibi log -1 --format='candidate %H tree %T parent %P'
          git -C "$evidence/negative" diff -- src/authoring/source_catalog.c
          sha256sum chibi/test/language/source_assets.c chibi/tools/test_policy.py
      - name: Install the engine's pinned native test toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-18-dev libclang-rt-18-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv "$RUNNER_TEMP/catalog-regression/toolchain"
          "$RUNNER_TEMP/catalog-regression/toolchain/bin/pip" install --only-binary=:all: --require-hashes -r chibi/.github/build-tools.txt
          echo "$RUNNER_TEMP/catalog-regression/toolchain/bin" >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          clang-18 --version
          "$RUNNER_TEMP/catalog-regression/toolchain/bin/cmake" --version
          "$RUNNER_TEMP/catalog-regression/toolchain/bin/ninja" --version
          "$UBSAN_SYMBOLIZER_PATH" --version
      - name: Prepare compilation and fixture evidence checks
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/catalog-regression/check-build.py" <<'PY'
          import hashlib, json, pathlib, shlex, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          cache = (root / 'build/CMakeCache.txt').read_text()
          for setting in ('CMAKE_BUILD_TYPE:STRING=Debug', 'CHIBI_ENABLE_SANITIZERS:BOOL=ON',
                          'CHIBI_SANITIZERS:STRING=address,undefined', 'CHIBI_ENABLE_WARNINGS:BOOL=ON'):
              assert setting in cache.splitlines(), setting
              print(setting)
          commands = json.loads((root / 'build/compile_commands.json').read_text())
          for source in ('src/authoring/source_catalog.c', 'test/language/source_assets.c'):
              matches = [entry for entry in commands
                         if (pathlib.Path(entry['directory']) / entry['file']).resolve() == root / source]
              assert matches, source
              for entry in matches:
                  args = entry.get('arguments') or shlex.split(entry['command'])
                  assert '-fsanitize=address,undefined' in args, args
                  assert '-fno-omit-frame-pointer' in args, args
                  assert not any(arg.startswith('-fno-sanitize') for arg in args), args
                  assert '-DNDEBUG' not in args, args
                  assert '-g' in args and '-Werror' in args, args
                  if source.endswith('source_assets.c'):
                      assert '-DCHIBI_TEST_SOURCE_ASSETS' in args, args
                      assert '-UNDEBUG' in args, args
                  print(json.dumps(entry, sort_keys=True))
          binary = root / 'build/test/language/test_language'
          assert binary.is_file(), binary
          print('test artifact', hashlib.sha256(binary.read_bytes()).hexdigest(), binary)
          PY
          # This is workflow evidence/cleanup only. The behavioral test stays in C.
          cat > "$RUNNER_TEMP/catalog-regression/fixtures.py" <<'PY'
          import json, os, pathlib, sys
          snapshot = pathlib.Path(sys.argv[2])
          paths = set(pathlib.Path('/tmp').glob('chibi-source-no-requests.*'))
          if sys.argv[1] == 'before':
              snapshot.write_text(json.dumps(sorted(map(str, paths))))
          else:
              before = set(map(pathlib.Path, json.loads(snapshot.read_text())))
              remaining = paths - before
              for directory in sorted(remaining):
                  assert not directory.is_symlink() and directory.stat().st_uid == os.getuid()
                  library = directory / 'libraries'
                  source = library / 'Plain.chibi'
                  assert set(directory.iterdir()) == {library} and not library.is_symlink()
                  assert set(library.iterdir()) == {source} and not source.is_symlink()
                  assert source.read_text() == 'Plain :: library { Identity :: (value: int) -> int { return value } }\n'
                  source.unlink()
                  library.rmdir()
                  directory.rmdir()
                  print('Removed this run\'s leftover fixture:', directory)
              if sys.argv[1] == 'after-candidate':
                  assert not remaining, 'Candidate teardown left its temporary fixture behind'
          PY
      - name: Build the isolated parent-source control with existing sanitizers
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/catalog-regression"
          make -C "$evidence/negative" test-build JOBS=2 LIBCLANG_ROOT=/usr/lib/llvm-18
          python3 "$evidence/check-build.py" "$evidence/negative" | tee "$evidence/negative-build.txt"
          test "$(git -C "$evidence/negative" diff --name-only)" = src/authoring/source_catalog.c
          test "$(git -C "$evidence/negative" hash-object src/authoring/source_catalog.c)" = d179b82e172dcc9ff4c0b8e96d66081f6202429a
      - name: Measure the negative selector under its unchanged 60-second supervisor
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/catalog-regression"
          python3 "$evidence/fixtures.py" before "$evidence/negative-fixtures.json"
          cd "$evidence/negative"
          set +e
          CHIBI_LANGUAGE_BUILD_DIR=build/test/language python3 tools/test_policy.py tool prototype-document > "$evidence/negative.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$evidence/negative.exit"
          cat "$evidence/negative.log"
          echo "Negative selector exit: $result"
          python3 "$evidence/fixtures.py" after-negative "$evidence/negative-fixtures.json"
      - name: Build the exact clean candidate with existing sanitizers
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/catalog-regression"
          test "$(git -C chibi rev-parse HEAD)" = "$ENGINE"
          test -z "$(git -C chibi status --porcelain)"
          make -C chibi test-build JOBS=2 LIBCLANG_ROOT=/usr/lib/llvm-18
          python3 "$evidence/check-build.py" chibi | tee "$evidence/candidate-build.txt"
          test -z "$(git -C chibi status --porcelain)"
      - name: Measure the clean candidate under the same 60-second supervisor
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/catalog-regression"
          python3 "$evidence/fixtures.py" before "$evidence/candidate-fixtures.json"
          cd chibi
          set +e
          CHIBI_LANGUAGE_BUILD_DIR=build/test/language python3 tools/test_policy.py tool prototype-document > "$evidence/candidate.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$evidence/candidate.exit"
          cat "$evidence/candidate.log"
          echo "Candidate selector exit: $result"
          python3 "$evidence/fixtures.py" after-candidate "$evidence/candidate-fixtures.json"
          test "$(git rev-parse HEAD)" = "$ENGINE"
          test -z "$(git status --porcelain)"
          sha256sum build/test/language/test_language test/language/source_assets.c src/authoring/source_catalog.c tools/test_policy.py
      - name: Require the named failed-before and complete passed-after evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/catalog-regression" <<'PY'
          import json, pathlib, re, shlex, sys
          evidence = pathlib.Path(sys.argv[1])
          negative = (evidence / 'negative.log').read_text()
          candidate = re.sub(r'\x1b\[[0-9;]*m', '', (evidence / 'candidate.log').read_text())
          case = 'source_catalog_analyzes_libraries_without_specialization_requests'
          result = int((evidence / 'negative.exit').read_text())
          assert result not in (0, 124, 130), f'Invalid negative result: {result}'
          assert re.search(r'source_catalog\.c:1659:\d+: runtime error: null pointer passed as argument 1', negative), negative
          assert re.search(r'#[0-9]+ .*analyze_requested\b', negative), negative
          assert re.search(r'#[0-9]+ .*' + case + r'\b.*source_assets\.c:', negative), 'New fixture was not the failing caller'
          assert 'UndefinedBehaviorSanitizer: undefined-behavior' in negative, negative
          assert 'ceiling 60s' in negative and 'exceeded its aggregate deadline' not in negative
          assert int((evidence / 'candidate.exit').read_text()) == 0, candidate
          assert 'ceiling 60s' in candidate and 'runtime error:' not in candidate, candidate
          assert 'ERROR: AddressSanitizer' not in candidate and 'ERROR: LeakSanitizer' not in candidate, candidate
          root = pathlib.Path('chibi')
          cases = []
          for source in ('prototype.c', 'source_assets.c'):
              cases += re.findall(r'RUN_TEST_CASE\((\w+)\)', (root / 'test/language' / source).read_text())
          commands = json.loads((root / 'build/compile_commands.json').read_text())
          native_services = any('-DCHIBI_TEST_RECORD_SERVICES' in (entry.get('arguments') or shlex.split(entry['command']))
                                for entry in commands if pathlib.Path(entry['file']).name == 'source_assets.c')
          if not native_services:
              cases.remove('source_relationship_native_commands_are_deferred')
          assert case in cases
          for name in cases:
              assert re.search(r'Running: ' + name + r' \(OK\)', candidate), name
          assert re.search(r'Summary: Passed: ' + str(len(cases)) + r' Failed: 0 Total: ' + str(len(cases)) + r'\b', candidate), candidate
          print(f'Verified {len(cases)} original and new cases; named NULL-qsort failure before, clean pass after.')
          PY
      - name: Remove only this job's disposable negative worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          negative="$RUNNER_TEMP/catalog-regression/negative"
          if [ -f "$negative/.git" ]; then
            git -C chibi worktree remove --force "$negative"
          fi

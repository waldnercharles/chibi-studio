name: Publish reusable web editor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "projects/**"
      - "web/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "projects/**"
      - "web/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/publish.yml"
      - ".github/engine-ref"
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: publish-editor-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.10

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.version.outputs.engine }}
      published: ${{ steps.version.outputs.published }}
      paired: ${{ steps.version.outputs.paired }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the exact engine SDK
        id: version
        env:
          GH_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          STUDIO: ${{ github.sha }}
          ALLOW_PIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          if [ "$ALLOW_PIN" = true ] && [ -f .github/engine-ref ]; then
            engine=$(<.github/engine-ref)
            if [[ ! "$engine" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::.github/engine-ref must contain one full lowercase engine commit SHA."
              exit 1
            fi
            echo "engine=$engine" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "paired=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match native CI's engine main, resolved once for this whole workflow.
          ENGINE=$(gh api repos/waldnercharles/chibi/commits/main --jq .sha)
          export ENGINE
          gh api --paginate --slurp 'repos/waldnercharles/chibi/releases?per_page=100' > "$RUNNER_TEMP/engine-releases.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          engine = os.environ["ENGINE"]
          if not re.fullmatch(r"[0-9a-f]{40}", engine):
              raise SystemExit("Invalid engine revision")
          pages = json.loads((Path(os.environ["RUNNER_TEMP"]) / "engine-releases.json").read_text())
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("Invalid engine release response")
          releases = [release for page in pages for release in page]
          release = next((r for r in releases
                          if r["tag_name"] == "engine-" + engine and not r["draft"]), None)
          required = {"chibi-web-sdk.tar.gz", "chibi-export-linux-x64.tar.gz", "SHA256SUMS", "build.json"}
          if release:
              assets = {a["name"] for a in release["assets"]
                        if a["state"] == "uploaded" and a["size"] > 0}
              if not required <= assets:
                  raise SystemExit("Published engine release is incomplete; refusing source fallback")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("engine=" + engine, file=output)
              print("published=" + str(release is not None).lower(), file=output)
          PY
          engine=$ENGINE
          build=true
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if curl --fail --silent --show-error --retry 3 \
                https://waldnercharles.github.io/chibi-studio/studio.json -o published.json; then
              if python3 -c 'import json,sys; p=json.load(open("published.json")); sys.exit(not (p.get("format")==1 and p.get("engine")==sys.argv[1] and p.get("studio")==sys.argv[2]))' "$engine" "$STUDIO"; then
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  editor:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and verify the installed web SDK
        if: needs.version.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ENGINE: ${{ needs.version.outputs.engine }}
        shell: bash
        run: |
          mkdir packages sdk
          gh release download "engine-$ENGINE" --repo waldnercharles/chibi \
            --pattern chibi-web-sdk.tar.gz --pattern SHA256SUMS --pattern build.json --dir packages
          cd packages
          # Verify only the downloaded members of the shared checksum manifest.
          awk '$2 == "chibi-web-sdk.tar.gz" || $2 == "build.json"' SHA256SUMS > selected-sums
          test "$(wc -l < selected-sums)" -eq 2
          sha256sum --check selected-sums
          python3 -c 'import json,os; p=json.load(open("build.json")); assert p["format"] == 1 and p["engine_sha"] == os.environ["ENGINE"] and p["emsdk_version"] == os.environ["EMSDK_VERSION"] and p["platform"] == "ubuntu-24.04-x64" and p["web_threads"] is False'
          tar -xzf chibi-web-sdk.tar.gz -C ../sdk
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - uses: actions/checkout@v4
        if: needs.version.outputs.published != 'true'
        with:
          repository: waldnercharles/chibi
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ref: ${{ needs.version.outputs.engine }}
          path: engine
          persist-credentials: false
      - name: Install the host reflection compiler
        if: needs.version.outputs.published != 'true'
        run: sudo apt-get install -y --no-install-recommends clang-18 libclang-18-dev
      - name: Package the exact engine web SDK from source
        if: needs.version.outputs.published != 'true'
        working-directory: engine
        env:
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          make package-web-sdk WEB_SDK_PREFIX="$GITHUB_WORKSPACE/sdk" \
            LIBCLANG_ROOT=/usr/lib/llvm-18 \
            NATIVE_TOOLCHAIN_FLAGS='-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18' \
            WEB_THREADS=0 JOBS=2
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Verify the installed SDK identity
        env:
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sdk = json.loads(Path("sdk/share/chibi/package.json").read_text())
          assert sdk["manifest_format"] == 1
          assert sdk["kind"] == "sdk"
          assert sdk["source"]["revision"] == os.environ["ENGINE"]
          assert sdk["source"]["dirty"] is False
          assert sdk["requirements"]["system"] == "Emscripten"
          assert sdk["requirements"]["web_threads"] is False
          assert sdk["build"]["configuration"] == "Release"
          assert sdk["build"]["native_backend"] is False
          PY
      - name: Build Studio against the installed SDK
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DChibi_DIR="$GITHUB_WORKSPACE/sdk/lib/cmake/Chibi"
          cmake --build build-web --target chibi-studio --parallel 2
          cmake --install build-web --prefix "$GITHUB_WORKSPACE/site"
      - name: Package the reusable editor and its version
        if: needs.version.outputs.paired != 'true'
        env:
          ENGINE: ${{ needs.version.outputs.engine }}
          STUDIO: ${{ github.sha }}
        run: |
          tar -czf "site/editor-$STUDIO-$ENGINE.tar.gz" -C site \
            chibi-studio.html chibi-studio.js chibi-studio.wasm chibi-studio.data chibi-default.js
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("site")
          archive = f'editor-{os.environ["STUDIO"]}-{os.environ["ENGINE"]}.tar.gz'
          manifest = dict(format=1, engine=os.environ["ENGINE"], studio=os.environ["STUDIO"],
                          archive=archive, sha256=hashlib.sha256((root / archive).read_bytes()).hexdigest())
          (root / "studio.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (root / "index.html").write_text('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=chibi-studio.html"><a href="chibi-studio.html">Open Chibi Studio</a>\n')
          (root / ".nojekyll").touch()
          PY
      - uses: actions/upload-pages-artifact@v3
        if: needs.version.outputs.paired != 'true'
        with:
          path: site
          retention-days: 1

  deploy:
    needs: [version, editor]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.published == 'true' && needs.version.outputs.paired != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reusable editor
        id: deployment
        uses: actions/deploy-pages@v4

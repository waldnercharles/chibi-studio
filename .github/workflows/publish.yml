name: Publish reusable web editor

on:
  workflow_dispatch:
    inputs:
      preview_77:
        description: Build the reviewed PR77 checkpoint at /previews/77/
        type: boolean
        default: false
  pull_request_target:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "projects/**"
      - "web/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/publish.yml"
      - ".github/engine-ref"
      - "tools/pages_site.py"
      - "tests/tools/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "projects/**"
      - "web/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/publish.yml"
      - ".github/engine-ref"
      - "tools/pages_site.py"
      - "tests/tools/**"
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: publish-editor-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.10

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.version.outputs.engine }}
      published: ${{ steps.version.outputs.published }}
      build: ${{ steps.version.outputs.build }}
      paired: ${{ steps.version.outputs.paired }}
      mode: ${{ steps.version.outputs.mode }}
      studio: ${{ steps.version.outputs.studio }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages tooling with small C fixtures
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Itests/acceptance tests/tools/main.c -o "$RUNNER_TEMP/studio-tools"
          "$RUNNER_TEMP/studio-tools" --pages-site "$GITHUB_WORKSPACE"
      - name: Select the exact engine SDK
        id: version
        env:
          GH_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          STUDIO: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PREVIEW_77: ${{ inputs.preview_77 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ALLOW_PIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          mode=production
          if [ "$EVENT" = pull_request_target ]; then
            mode=skip
            if [ "$PR_NUMBER" = 77 ] && [ "$PR_MERGED" = true ]; then mode=cleanup77; fi
          elif [ "$EVENT" = pull_request ]; then
            mode=check
          elif [ "$PREVIEW_77" = true ]; then
            mode=preview77
            STUDIO=c28301748699a158fec08a475ca7dde872bb4960
          fi
          {
            echo "mode=$mode"
            echo "studio=$STUDIO"
          } >> "$GITHUB_OUTPUT"
          if [ "$mode" = cleanup77 ] || [ "$mode" = skip ]; then
            {
              echo 'build=false'
              echo 'published=false'
              echo 'paired=false'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$GH_TOKEN"
          # Match native CI's selected engine, resolved once for this workflow.
          paired=false
          if [ "$mode" = preview77 ]; then
            ENGINE=d1154cdb8677cbfe479d4be40db7ca480d10f103
            paired=true
          elif [ "$ALLOW_PIN" = true ] && [ -f .github/engine-ref ]; then
            ENGINE=$(<.github/engine-ref)
            if [[ ! "$ENGINE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::.github/engine-ref must contain one full lowercase engine commit SHA."
              exit 1
            fi
            paired=true
          else
            ENGINE=$(gh api repos/waldnercharles/chibi/commits/main --jq .sha)
          fi
          echo "paired=$paired" >> "$GITHUB_OUTPUT"
          export ENGINE
          export PAGES_MODE="$mode"
          gh api --paginate --slurp 'repos/waldnercharles/chibi/releases?per_page=100' > "$RUNNER_TEMP/engine-releases.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          engine = os.environ["ENGINE"]
          if not re.fullmatch(r"[0-9a-f]{40}", engine):
              raise SystemExit("Invalid engine revision")
          pages = json.loads((Path(os.environ["RUNNER_TEMP"]) / "engine-releases.json").read_text())
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("Invalid engine release response")
          releases = [release for page in pages for release in page]
          release = next((r for r in releases
                          if r["tag_name"] == "engine-" + engine and not r["draft"]), None)
          required = {"chibi-web-sdk.tar.gz", "chibi-export-linux-x64.tar.gz", "SHA256SUMS", "build.json"}
          if os.environ["PAGES_MODE"] == "preview77" and release is None:
              raise SystemExit("Preview77 requires its verified released engine SDK")
          if release:
              assets = {a["name"] for a in release["assets"]
                        if a["state"] == "uploaded" and a["size"] > 0}
              if not required <= assets:
                  raise SystemExit("Published engine release is incomplete; refusing source fallback")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("engine=" + engine, file=output)
              print("published=" + str(release is not None).lower(), file=output)
          PY
          engine=$ENGINE
          build=true
          if [ "$mode" = production ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if curl --fail --silent --show-error --retry 3 \
                https://waldnercharles.github.io/chibi-studio/studio.json -o published.json; then
              if python3 -c 'import json,sys; p=json.load(open("published.json")); sys.exit(not (p.get("format")==1 and p.get("engine")==sys.argv[1] and p.get("studio")==sys.argv[2]))' "$engine" "$STUDIO"; then
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  editor:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.studio }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Require the selected application source
        env:
          STUDIO: ${{ needs.version.outputs.studio }}
        run: |
          test "$(git -C app rev-parse HEAD)" = "$STUDIO"
          test -z "$(git -C app status --porcelain)"
      - name: Download and verify the installed web SDK
        if: needs.version.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ENGINE: ${{ needs.version.outputs.engine }}
        shell: bash
        run: |
          mkdir packages sdk
          gh release download "engine-$ENGINE" --repo waldnercharles/chibi \
            --pattern chibi-web-sdk.tar.gz --pattern SHA256SUMS --pattern build.json --dir packages
          cd packages
          # Verify only the downloaded members of the shared checksum manifest.
          awk '$2 == "chibi-web-sdk.tar.gz" || $2 == "build.json"' SHA256SUMS > selected-sums
          test "$(wc -l < selected-sums)" -eq 2
          sha256sum --check selected-sums
          python3 -c 'import json,os; p=json.load(open("build.json")); assert p["format"] == 1 and p["engine_sha"] == os.environ["ENGINE"] and p["emsdk_version"] == os.environ["EMSDK_VERSION"] and p["platform"] == "ubuntu-24.04-x64" and p["web_threads"] is False'
          tar -xzf chibi-web-sdk.tar.gz -C ../sdk
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - uses: actions/checkout@v4
        if: needs.version.outputs.published != 'true'
        with:
          repository: waldnercharles/chibi
          token: ${{ secrets.CHIBI_ENGINE_TOKEN }}
          ref: ${{ needs.version.outputs.engine }}
          path: engine
          persist-credentials: false
      - name: Install the host reflection compiler
        if: needs.version.outputs.published != 'true'
        run: sudo apt-get install -y --no-install-recommends clang-18 libclang-18-dev
      - name: Package the exact engine web SDK from source
        if: needs.version.outputs.published != 'true'
        working-directory: engine
        env:
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          make package-web-sdk WEB_SDK_PREFIX="$GITHUB_WORKSPACE/sdk" \
            LIBCLANG_ROOT=/usr/lib/llvm-18 \
            NATIVE_TOOLCHAIN_FLAGS='-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18' \
            WEB_THREADS=0 JOBS=2
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Verify the installed SDK identity
        env:
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sdk = json.loads(Path("sdk/share/chibi/package.json").read_text())
          assert sdk["manifest_format"] == 1
          assert sdk["kind"] == "sdk"
          assert sdk["source"]["revision"] == os.environ["ENGINE"]
          assert sdk["source"]["dirty"] is False
          assert sdk["requirements"]["system"] == "Emscripten"
          assert sdk["requirements"]["web_threads"] is False
          assert sdk["build"]["configuration"] == "Release"
          assert sdk["build"]["native_backend"] is False
          PY
      - name: Build Studio against the installed SDK
        run: |
          emcmake cmake -S app -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DChibi_DIR="$GITHUB_WORKSPACE/sdk/lib/cmake/Chibi"
          cmake --build build-web --target chibi-studio --parallel 2
          cmake --install build-web --prefix "$GITHUB_WORKSPACE/site"
      - name: Package the selected serial application
        if: needs.version.outputs.mode != 'check'
        env:
          MODE: ${{ needs.version.outputs.mode }}
        run: |
          preview=()
          if [ "$MODE" = preview77 ]; then preview=(--preview77); fi
          python3 tooling/tools/pages_site.py package --site site --source app --sdk sdk "${preview[@]}"
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.mode != 'check'
        with:
          name: studio-web-input
          path: site
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: [version, editor]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.version.result == 'success' &&
      (needs.version.outputs.mode == 'cleanup77' ||
       (needs.editor.result == 'success' && needs.version.outputs.published == 'true' &&
        (needs.version.outputs.mode == 'preview77' || needs.version.outputs.mode == 'production')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: studio-pages-publisher
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This is the trusted workflow revision on main, never the preview checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.mode != 'cleanup77'
        with:
          name: studio-web-input
          path: application
      - name: Restore the last successfully deployed complete site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pages_site.py restore --output previous
      - name: Assemble only the approved change
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.version.outputs.mode }}
        run: |
          gh api repos/waldnercharles/chibi-studio/pulls/77 > "$RUNNER_TEMP/pr77.json"
          main=$(gh api repos/waldnercharles/chibi-studio/git/ref/heads/main --jq .object.sha)
          python3 tools/pages_site.py compose --mode "$MODE" --previous previous \
            --built application --output site --pr "$RUNNER_TEMP/pr77.json" --main "$main"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 90
      - name: Deploy the reusable editor
        id: deployment
        uses: actions/deploy-pages@v4

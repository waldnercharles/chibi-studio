name: CI control

# Re-runs failed checks for maintainers and agents whose own GitHub access
# cannot. The ci-rerun label does it on request, for a sender with write access
# (which GitHub requires for re-runs anyway). On a schedule, a PR whose
# description names an engine PR (chibi#N or its URL) gets its failed checks
# re-run once after that engine PR merges, since CI builds against engine main.
# A PR that pins .github/engine-ref builds that engine commit instead, so it is
# skipped. Only branches of this repository qualify, and only a PR's own
# pull_request runs of CI and the web editor check are re-run, never a push or
# publishing run that shares the commit. Neither job checks out PR code.
on:
  pull_request_target:
    types: [labeled]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  rerun:
    name: Re-run failed checks
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'ci-rerun'
    # Per job, so unrelated labels never replace a pending request.
    concurrency: ci-control-rerun-${{ github.event.pull_request.number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SENDER: ${{ github.event.sender.login }}
    steps:
      - name: Require write access and the event's head commit
        run: |
          permission=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" --jq .permission)
          case $permission in
            admin | write) ;;
            *) echo "::error::$SENDER has $permission access; re-runs need write access."; exit 1 ;;
          esac
          head=$(gh api "repos/$GH_REPO/git/ref/heads/$HEAD_REF" --jq .object.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::$HEAD_REF moved from $HEAD_SHA to $head. Label the PR again for the new head."
            exit 1
          fi
      - name: Re-run the PR's failed runs
        run: |
          # The latest pull_request run of each workflow on this branch only:
          # a push or publishing run can share the commit.
          for workflow in ci.yml publish.yml; do
            gh run list --workflow "$workflow" --commit "$HEAD_SHA" --limit 100 \
              --json databaseId,event,headBranch,status,conclusion \
              --jq 'map(select(.event == "pull_request" and .headBranch == env.HEAD_REF)) | max_by(.databaseId) // empty
                    | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out"))) | .databaseId'
          done | while read -r run; do
            echo "Re-running failed jobs of run $run"
            gh run rerun "$run" --failed
          done
      - name: Remove the label
        if: always()
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/ci-rerun"

  dependencies:
    name: Re-run checks after engine dependencies merge
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ENGINE_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
    steps:
      - name: Re-run failed runs that started before a named engine PR merged
        run: |
          gh api "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GH_REPO)
                  | [.number, .head.ref, .head.sha, ([.body // "" | scan("\\bchibi#[0-9]+|github\\.com/waldnercharles/chibi/pull/[0-9]+")
                  | scan("[0-9]+$")] | unique | join(","))] | select(.[3] != "") | @tsv' |
          while IFS=$'\t' read -r pr ref sha engine_prs; do
            if gh api "repos/$GH_REPO/contents/.github/engine-ref?ref=$sha" --silent 2> /dev/null; then
              continue
            fi
            merged=$(for n in ${engine_prs//,/ }; do
              GH_TOKEN=$ENGINE_TOKEN gh api "repos/waldnercharles/chibi/pulls/$n" --jq '.merged_at // empty'
            done | sort | tail -n 1)
            [ -n "$merged" ] || continue
            for workflow in ci.yml publish.yml; do
              REF=$ref MERGED=$merged gh run list --workflow "$workflow" --commit "$sha" --limit 100 \
                --json databaseId,event,headBranch,status,conclusion,startedAt \
                --jq 'map(select(.event == "pull_request" and .headBranch == env.REF)) | max_by(.databaseId) // empty
                      | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out")) and .startedAt < env.MERGED)
                      | .databaseId'
            done | while read -r run; do
              echo "PR #$pr: re-running failed jobs of run $run after an engine PR merged at $merged"
              gh run rerun "$run" --failed
            done
          done

name: CI control

# Re-runs failed checks for people and agents whose own GitHub access cannot.
# The ci-rerun label does it on request. On a schedule, a PR whose description
# names an engine PR (chibi#N or its URL) gets its failed checks re-run once
# after that engine PR merges, since CI builds against engine main. Labels need
# triage access, and only branches of this repository qualify, so outside
# contributors cannot start these runs. Neither job checks out PR code.
on:
  pull_request_target:
    types: [labeled]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  pull-requests: write

jobs:
  rerun:
    name: Re-run failed checks
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'ci-rerun'
    # Per job, so unrelated labels never replace a pending request.
    concurrency: ci-control-rerun-${{ github.event.pull_request.number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Re-run failed runs of the head commit
        run: |
          gh run list --commit "$HEAD_SHA" --limit 100 \
            --json databaseId,workflowName,event,status,conclusion \
            --jq 'map(select(.event != "pull_request_target")) | group_by(.workflowName) | map(max_by(.databaseId))
                  | .[] | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out"))) | .databaseId' |
          while read -r run; do
            echo "Re-running failed jobs of run $run"
            gh run rerun "$run" --failed
          done
      - name: Remove the label
        if: always()
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/ci-rerun"

  dependencies:
    name: Re-run checks after engine dependencies merge
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ENGINE_TOKEN: ${{ secrets.CHIBI_ENGINE_TOKEN }}
    steps:
      - name: Re-run failed runs that started before a named engine PR merged
        run: |
          gh api "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GH_REPO)
                  | [.number, .head.sha, ([.body // "" | scan("\\bchibi#[0-9]+|github\\.com/waldnercharles/chibi/pull/[0-9]+")
                  | scan("[0-9]+$")] | unique | join(","))] | select(.[2] != "") | @tsv' |
          while IFS=$'\t' read -r pr sha engine_prs; do
            merged=$(for n in ${engine_prs//,/ }; do
              GH_TOKEN=$ENGINE_TOKEN gh api "repos/waldnercharles/chibi/pulls/$n" --jq '.merged_at // empty'
            done | sort | tail -n 1)
            [ -n "$merged" ] || continue
            MERGED=$merged gh run list --commit "$sha" --limit 100 \
              --json databaseId,workflowName,event,status,conclusion,startedAt \
              --jq 'map(select(.event != "pull_request_target" and .event != "schedule"))
                    | group_by(.workflowName) | map(max_by(.databaseId)) | .[]
                    | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out")) and .startedAt < env.MERGED)
                    | .databaseId' |
            while read -r run; do
              echo "PR #$pr: re-running failed jobs of run $run after an engine PR merged at $merged"
              gh run rerun "$run" --failed
            done
          done
